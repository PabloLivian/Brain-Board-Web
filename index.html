<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Brain Board — Tu pizarra infinita local para Windows. Rápida y offline, con Cerebro IA, Mapa de Frescura, búsqueda en todos tus tableros y copias automáticas."
    />
    <meta name="theme-color" content="#0e1215" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Brain Board</title>
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('brainboard_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', savedTheme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body class="dark-theme">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
